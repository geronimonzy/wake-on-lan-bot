services:
  telegram-wol-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-wol-bot
    restart: unless-stopped

    # Use host network for WOL packet broadcasting
    # This is required for etherwake to send magic packets on the local network
    network_mode: host

    # Environment variables from .env file
    env_file:
      - .env

    environment:
      - TZ=UTC

    # Mount devices configuration
    volumes:
      - ./devices.conf:/app/devices.conf:ro
      - ./state:/app/state

    # Security options
    security_opt:
      - no-new-privileges:true

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M

    # Read-only root filesystem (except for state directory)
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=10M

    # Drop all capabilities except NET_RAW (required for WOL)
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Healthcheck
    healthcheck:
      test: ["CMD", "pgrep", "-f", "bot.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s